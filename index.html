<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monitoreo FEN - Sitios Arqueológicos</title>
    
    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* FORZAR IMPRESIÓN A COLOR */
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body { background-color: #f8f9fa; }
        #map { height: 45vh; width: 100%; border-radius: 8px; border: 2px solid #333; z-index: 1; }
        
        .table-responsive { max-height: 38vh; overflow-y: auto; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table { min-width: 850px; /* Ancho extra para que quepan las 7 columnas */ }
        
        /* ENCABEZADOS DE LA TABLA - AZUL MEDIO */
        .table th { 
            position: sticky; 
            top: 0; 
            z-index: 2; 
            background-color: #1e6091 !important;
            color: white; 
            font-size: 0.75rem; 
            white-space: nowrap; 
            border-bottom: 2px solid #154360;
        }
        
        /* COLCHÓN INVISIBLE AL FINAL DE LA TABLA EN PANTALLA */
        .table th:last-child, 
        .table td:last-child {
            padding-right: 60px !important; 
        }
        
        /* =========================================
           COLUMNA DEL SITIO FIJA (STICKY)
           ========================================= */
        .table th:first-child,
        .table td:first-child {
            position: sticky;
            left: 0;
            z-index: 2;
            background-color: #ffffff;
            border-right: none; 
        }
        
        .table th:first-child::after,
        .table td:first-child::after {
            content: "";
            position: absolute;
            top: 0;
            right: -2px; 
            bottom: 0;
            width: 2px;
            background-color: #adb5bd; 
            z-index: 10;
        }

        .table th:first-child {
            z-index: 3;
            background-color: #1e6091 !important; 
        }

        .table td:first-child {
            box-shadow: 4px 0 6px -3px rgba(0,0,0,0.2);
        }

        .table-striped > tbody > tr:nth-of-type(odd) > td:first-child {
            background-color: #f9f9f9; 
        }
        .table-hover > tbody > tr:hover > td:first-child {
            background-color: #e9ecef;
        }

        /* ========================================= */
        
        .clickable-row { cursor: pointer; transition: background-color 0.2s; }
        
        .avance-input, .prog-input { width: 60px; text-align: center; }
        .contrato-input { width: 110px !important; padding: 0.25rem 0.5rem; text-align: center; }
        .form-control-sm { font-size: 16px; }
        
        /* Bloquear inputs cuando no está en modo edición */
        .modo-lectura .contrato-input, .modo-lectura .avance-input, .modo-lectura .prog-input {
            pointer-events: none;
            background-color: transparent;
            border: none;
            box-shadow: none;
            color: #333;
            text-align: center;
            padding: 0;
        }
        .modo-lectura .contrato-input { font-weight: normal; font-size: 0.85rem; }
        .modo-lectura .avance-input, .modo-lectura .prog-input { font-weight: bold; text-align: center; }
        .modo-lectura .input-group-text { display: none; }

        /* Estilos de los Tooltips e Íconos */
        .leaflet-tooltip { background: rgba(255, 255, 255, 0.95); border: 1px solid #ccc; border-radius: 4px; box-shadow: 1px 1px 4px rgba(0,0,0,0.3); font-size: 11px; font-weight: bold; padding: 2px 6px; white-space: nowrap; pointer-events: none; }
        .custom-icon { display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-family: Arial, sans-serif; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .icon-circle { border-radius: 50%; width: 26px; height: 26px; font-size: 10px; }
        .icon-square { border-radius: 4px; width: 26px; height: 26px; font-size: 12px; }
        .icon-diamond { transform: rotate(45deg); width: 24px; height: 24px; font-size: 10px; }
        .icon-diamond span { transform: rotate(-45deg); display: block; }
        
        .bg-alta { background-color: #dc3545; }
        .bg-media { background-color: #ffc107; color: #000 !important; }
        .bg-baja { background-color: #28a745; }

        /* Colores de Estado */
        .estado-verde { background-color: #28a745; color: white; }
        .estado-amarillo { background-color: #ffc107; color: black; }
        .estado-rojo { background-color: #dc3545; color: white; }

        .popup-highlight-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; color: white; }
        .popup-highlight-avance { font-size: 20px; font-weight: 900; color: #007bff; display: block; margin-top: 5px; }
        
        .badge-alta { background-color: #dc3545; color: white; }
        .badge-media { background-color: #ffc107; color: black; }
        .badge-baja { background-color: #28a745; color: white; }

        /* =========================================
           CONFIGURACIÓN PARA IMPRESIÓN EN HOJA A4 (HORIZONTAL)
           ========================================= */
        @media print {
            @page { 
                size: A4 landscape; /* HOJA HORIZONTAL PARA QUE ENTREN LAS COLUMNAS */
                margin: 0.5cm; 
            }
            body { background-color: white !important; }
            #map, .no-print, .btn { display: none !important; }
            .container-fluid { padding: 0 !important; width: 100% !important; max-width: 100% !important; }
            .card { border: none !important; box-shadow: none !important; }
            
            /* Hacer visible el panel superior en el PDF */
            .card-header { display: block !important; -webkit-print-color-adjust: exact !important; padding: 5px !important; }
            
            .table-responsive { overflow: visible !important; max-height: none !important; }
            .table { min-width: 100% !important; width: 100% !important; margin-bottom: 0 !important; font-size: 9px !important; }
            .table th, .table td { padding: 4px !important; }
            
            /* Quitar el efecto sticky en impresión */
            .table th, .table td:first-child { position: static !important; box-shadow: none !important; }
            .table th:first-child::after, .table td:first-child::after { display: none !important; }
            .table th:last-child, .table td:last-child { padding-right: 4px !important; }
            
            /* Ajustar inputs para que parezcan texto normal en el PDF */
            .modo-lectura .contrato-input, .modo-lectura .avance-input, .modo-lectura .prog-input { border: none; font-weight: normal; text-align: center; padding: 0; }
            
            /* FORZAR COLORES EN IMPRESIÓN */
            .table th { background-color: #1e6091 !important; color: white !important; }
            .table th:first-child { background-color: #1e6091 !important; }
            .badge-alta { background-color: #dc3545 !important; color: white !important; }
            .badge-media { background-color: #ffc107 !important; color: black !important; }
            .badge-baja { background-color: #28a745 !important; color: white !important; }
            
            .estado-verde { background-color: #28a745 !important; color: white !important; }
            .estado-amarillo { background-color: #ffc107 !important; color: black !important; }
            .estado-rojo { background-color: #dc3545 !important; color: white !important; }
            
            .card-header { background-color: #212529 !important; color: white !important; }
            #global-avance-contr { color: #28a745 !important; }
            #global-total-ejecutado { color: #17a2b8 !important; }
        }
    </style>
</head>
<body class="modo-lectura">

<div class="container-fluid py-2">
    <div class="row text-center mb-2 no-print">
        <div class="col-12 d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Panel de Monitoreo FEN</h5>
            <div>
                <button class="btn btn-sm btn-outline-dark" onclick="toggleAdmin()" id="btnAdmin">🔒 Modo Edición</button>
                <button class="btn btn-sm btn-outline-primary" onclick="window.print()">📄 Reporte PDF</button>
            </div>
        </div>
        <p class="text-muted mb-0" style="font-size: 12px;">Sitios Arqueológicos - Región Lambayeque</p>
    </div>

    <!-- MAPA -->
    <div class="row mb-3 no-print">
        <div class="col-12">
            <div id="map"></div>
        </div>
    </div>

    <!-- TABLA DE CONTROL -->
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <!-- PANEL SUPERIOR CON GLOBALES -->
                <div class="card-header bg-dark text-white p-2">
                    <div class="row text-center align-items-center">
                        <div class="col-4 border-end border-secondary">
                            <div style="font-size: 10px; text-transform: uppercase; color: #adb5bd;">Avance Global</div>
                            <div id="global-avance-contr" class="font-weight-bold text-success" style="font-size: 18px;">0.00%</div>
                        </div>
                        <div class="col-4 border-end border-secondary">
                            <div style="font-size: 10px; text-transform: uppercase; color: #adb5bd;">Total Contr.</div>
                            <div id="global-total-contr" class="font-weight-bold" style="font-size: 15px;">S/ 0.00</div>
                        </div>
                        <div class="col-4">
                            <div style="font-size: 10px; text-transform: uppercase; color: #adb5bd;">Total Ejecutado</div>
                            <div id="global-total-ejecutado" class="font-weight-bold text-info" style="font-size: 15px;">S/ 0.00</div>
                        </div>
                    </div>
                </div>
                
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0" style="font-size: 0.85rem;">
                            <thead>
                                <tr>
                                    <th>Sitio</th>
                                    <th class="text-center">Prioridad</th>
                                    <th class="text-center">Contr. (S/)</th>
                                    <th class="text-center">Avance Prog. (%)</th>
                                    <th class="text-center">Avance Ejec. (%)</th>
                                    <th class="text-center">Estado</th>
                                    <!-- NOMBRE DE COLUMNA ACTUALIZADO AQUÍ -->
                                    <th class="text-center">Monto Ejec (S/.)</th>
                                </tr>
                            </thead>
                            <tbody id="budgetTable">
                                <tr><td colspan="7" class="text-center py-3">Cargando datos de la nube...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://puente-fen.fiagotopo.workers.dev'; 
    const SUPABASE_KEY = 'sb_publishable_S-VFPOw7XhpURHUh01ideQ_tvNeDc42';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var map = L.map('map', { zoomControl: false }).setView([-6.65, -79.8], 10);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    var esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
    }).addTo(map);
    
    var esriStreets = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
    });
    L.control.layers({"Satelital": esriSatellite, "Callejero": esriStreets}).addTo(map);

    var tableBody = document.getElementById("budgetTable");
    var markersGroup = L.featureGroup().addTo(map);

    function calcularGlobales(sitios) {
        let totalContr = 0;
        let totalEjecutado = 0;

        sitios.forEach(s => {
            let c = Number(s.contrato) || 0;
            let a = Number(s.avance_ejec) || 0;

            totalContr += c;
            totalEjecutado += (c * (a / 100));
        });

        let pctContr = totalContr > 0 ? (totalEjecutado / totalContr) * 100 : 0;

        document.getElementById('global-total-contr').innerText = 'S/ ' + totalContr.toLocaleString('es-PE', {minimumFractionDigits: 2});
        document.getElementById('global-avance-contr').innerText = pctContr.toFixed(2) + '%';
        document.getElementById('global-total-ejecutado').innerText = 'S/ ' + totalEjecutado.toLocaleString('es-PE', {minimumFractionDigits: 2});
    }

    async function cargarDatos() {
        const { data: sitios, error } = await supabaseClient
            .from('sitios')
            .select('*')
            .order('id', { ascending: true });

        if (error) {
            console.error("Error cargando datos:", error);
            tableBody.innerHTML = `<tr><td colspan="7" class="text-danger text-center">Error al conectar con la base de datos. Revisa la consola.</td></tr>`;
            return;
        }

        tableBody.innerHTML = ''; 
        markersGroup.clearLayers(); 

        sitios.forEach(function(sitio) {
            let letraIcono = "CA", claseForma = "icon-circle";
            if (sitio.tipo === "Museo") { letraIcono = "M"; claseForma = "icon-square"; }
            else if (sitio.tipo === "Zona") { letraIcono = "ZA"; claseForma = "icon-diamond"; }
            else if (sitio.tipo === "SECTOR") { letraIcono = "S"; claseForma = "icon-circle"; }

            let claseColor = "bg-media", colorPrioridadHex = "#ffc107";
            if (sitio.prioridad === "ALTA") { claseColor = "bg-alta"; colorPrioridadHex = "#dc3545"; }
            if (sitio.prioridad === "BAJA") { claseColor = "bg-baja"; colorPrioridadHex = "#28a745"; }

            let iconHtml = `<div class="custom-icon ${claseForma} ${claseColor}"><span>${letraIcono}</span></div>`;
            var customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [26, 26], iconAnchor: [13, 13] });

            let contratoVal = sitio.contrato || 0;
            let avanceVal = sitio.avance_ejec || 0;
            let progVal = sitio.avance_prog || 0;
            
            let contratoFormat = contratoVal > 0 ? 'S/ ' + Number(contratoVal).toLocaleString('es-PE', {minimumFractionDigits: 2}) : '';
            let avanceFormat = avanceVal > 0 ? avanceVal + '%' : '0%';
            let progFormat = progVal > 0 ? progVal + '%' : '0%';
            
            let ejecutadoVal = contratoVal * (avanceVal / 100);
            let ejecutadoFormat = 'S/ ' + ejecutadoVal.toLocaleString('es-PE', {minimumFractionDigits: 2});

            let estadoVal = avanceVal - progVal;
            let estadoClass = "estado-verde";
            let estadoText = (estadoVal > 0 ? '+' : '') + estadoVal.toFixed(2) + '%';

            if (estadoVal < 0 && estadoVal >= -3) {
                estadoClass = "estado-amarillo";
            } else if (estadoVal < -3) {
                estadoClass = "estado-rojo";
            }

            var marker = L.marker([sitio.lat, sitio.lng], { icon: customIcon }).addTo(markersGroup);
            
            marker.bindTooltip(sitio.nombre, { permanent: true, direction: 'right', className: 'custom-tooltip', offset: [15, 0] });

            marker.bindPopup(`
                <div style="font-size: 13px; min-width: 180px;">
                    <b>${sitio.nombre}</b><br>
                    <span class="text-muted">Distrito: ${sitio.distrito}</span><br><hr style="margin: 6px 0;">
                    <b>Prioridad:</b> <span class="popup-highlight-badge" style="background-color: ${colorPrioridadHex}; color: ${sitio.prioridad === 'MEDIA' ? 'black' : 'white'};">${sitio.prioridad}</span><br>
                    <b>Ppto Contr:</b> S/ ${Number(contratoVal).toLocaleString('es-PE')}<br>
                    <b>Monto Ejec:</b> ${ejecutadoFormat}<br>
                    <div style="margin-top: 8px; background: #e9ecef; padding: 6px; border-radius: 6px; text-align: center;">
                        <span style="font-size: 11px; text-transform: uppercase; color: #6c757d;">Avance Ejec.</span>
                        <span class="popup-highlight-avance" id="popup-avance-${sitio.id}">${avanceVal}%</span>
                    </div>
                </div>
            `, { autoPanPaddingTopLeft: [20, 100] });

            var row = document.createElement("tr");
            row.className = "clickable-row";
            row.innerHTML = `
                <td><strong>${sitio.nombre}</strong><br><small class="text-muted">${sitio.distrito}</small></td>
                <td class="text-center"><span class="badge badge-${sitio.prioridad.toLowerCase()}">${sitio.prioridad}</span></td>
                <td class="text-center"><input type="text" class="form-control form-control-sm contrato-input mx-auto" id="contrato-${sitio.id}" value="${contratoFormat}" placeholder="0.00"></td>
                
                <td class="text-center">
                    <div class="input-group input-group-sm mx-auto" style="width: 70px;">
                        <input type="text" class="form-control prog-input text-center" id="prog-${sitio.id}" value="${progFormat}">
                    </div>
                </td>
                <td class="text-center">
                    <div class="input-group input-group-sm mx-auto" style="width: 70px;">
                        <input type="text" class="form-control avance-input text-center" id="avance-${sitio.id}" value="${avanceFormat}">
                    </div>
                </td>
                
                <td class="text-center"><span class="badge ${estadoClass}" id="estado-${sitio.id}">${estadoText}</span></td>
                <td class="text-center" id="ejecutado-${sitio.id}">${ejecutadoFormat}</td>
            `;
            tableBody.appendChild(row);

            row.addEventListener("click", function(e) {
                if(e.target.tagName.toLowerCase() === 'input') return;
                map.flyTo([sitio.lat + 0.015, sitio.lng], 13, { animate: true, duration: 1.2 });
                setTimeout(function() { marker.openPopup(); }, 1200);
            });

            let inputAvance = document.getElementById(`avance-${sitio.id}`);
            let inputContrato = document.getElementById(`contrato-${sitio.id}`);
            let inputProg = document.getElementById(`prog-${sitio.id}`);
            
            let tdEjecutado = document.getElementById(`ejecutado-${sitio.id}`);
            let badgeEstado = document.getElementById(`estado-${sitio.id}`);

            const setupInputFormatting = (input, isPercent) => {
                input.addEventListener("focus", function() {
                    this.value = this.value.replace(/[^0-9.-]/g, ''); 
                });
                input.addEventListener("blur", function() {
                    let raw = this.value.replace(/[^0-9.-]/g, '');
                    let num = raw === "" ? 0 : parseFloat(raw);
                    if (isPercent) {
                        this.value = num + '%';
                    } else {
                        this.value = num > 0 ? 'S/ ' + num.toLocaleString('es-PE', {minimumFractionDigits: 2}) : '';
                    }
                });
            };

            setupInputFormatting(inputContrato, false);
            setupInputFormatting(inputAvance, true);
            setupInputFormatting(inputProg, true);

            const guardarEnSupabase = async () => {
                if (document.body.classList.contains('modo-lectura')) return;
                
                let rawContr = inputContrato.value.replace(/[^0-9.-]/g, '');
                let rawAvan = inputAvance.value.replace(/[^0-9.-]/g, '');
                let rawProg = inputProg.value.replace(/[^0-9.-]/g, '');

                let nuevoContrato = rawContr === "" ? 0 : parseFloat(rawContr);
                let nuevoAvance = rawAvan === "" ? 0 : parseFloat(rawAvan);
                let nuevoProg = rawProg === "" ? 0 : parseFloat(rawProg);

                const { error } = await supabaseClient
                    .from('sitios')
                    .update({ 
                        contrato: nuevoContrato, 
                        avance_ejec: nuevoAvance, 
                        avance_prog: nuevoProg 
                    })
                    .eq('id', sitio.id);
                
                if (!error) {
                    sitio.contrato = nuevoContrato;
                    sitio.avance_ejec = nuevoAvance;
                    sitio.avance_prog = nuevoProg;

                    let ej = nuevoContrato * (nuevoAvance / 100);
                    tdEjecutado.innerText = 'S/ ' + ej.toLocaleString('es-PE', {minimumFractionDigits: 2});

                    let est = nuevoAvance - nuevoProg;
                    let nuevaClase = "estado-verde";
                    let nuevoTexto = (est > 0 ? '+' : '') + est.toFixed(2) + '%';

                    if (est < 0 && est >= -3) nuevaClase = "estado-amarillo";
                    else if (est < -3) nuevaClase = "estado-rojo";

                    badgeEstado.className = `badge ${nuevaClase}`;
                    badgeEstado.innerText = nuevoTexto;

                    calcularGlobales(sitios);
                    
                    let popupAvance = document.getElementById(`popup-avance-${sitio.id}`);
                    if (popupAvance) popupAvance.innerText = nuevoAvance + "%";
                }
            };

            [inputContrato, inputAvance, inputProg].forEach(input => {
                input.addEventListener("blur", guardarEnSupabase);
                input.addEventListener("keydown", function(e) { if (e.key === 'Enter') this.blur(); });
            });
        });

        calcularGlobales(sitios);
        map.fitBounds(markersGroup.getBounds(), { padding: [30, 30] });
    }

    function toggleAdmin() {
        const esModoLectura = document.body.classList.contains('modo-lectura');
        const btn = document.getElementById('btnAdmin');

        if (esModoLectura) {
            let pass = prompt("Ingrese la contraseña de administrador:");
            if (pass === "admin123") { 
                document.body.classList.remove('modo-lectura');
                btn.innerHTML = "🔓 Modo Edición ON";
                btn.classList.replace('btn-outline-dark', 'btn-success');
            } else if (pass !== null) {
                alert("Contraseña incorrecta.");
            }
        } else {
            document.body.classList.add('modo-lectura');
            btn.innerHTML = "🔒 Modo Edición";
            btn.classList.replace('btn-success', 'btn-outline-dark');
        }
    }

    cargarDatos();
</script>
</body>
</html>
