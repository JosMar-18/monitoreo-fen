<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monitoreo FEN - Sitios Arqueológicos</title>
    
    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { background-color: #f8f9fa; }
        #map { height: 50vh; width: 100%; border-radius: 8px; border: 2px solid #333; z-index: 1; }
        
        .table-responsive { max-height: 40vh; overflow-y: auto; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table { min-width: 650px; }
        .table th { position: sticky; top: 0; z-index: 2; background-color: #212529 !important; color: white; font-size: 0.75rem; white-space: nowrap; }
        
        .clickable-row { cursor: pointer; transition: background-color 0.2s; }
        .clickable-row:hover { background-color: #e9ecef !important; }
        
        .avance-input { width: 50px; text-align: center; }
        .contrato-input { width: 85px !important; padding: 0.25rem 0.5rem; text-align: right; }
        .form-control-sm { font-size: 16px; }
        
        .modo-lectura .contrato-input, .modo-lectura .avance-input {
            pointer-events: none;
            background-color: transparent;
            border: none;
            box-shadow: none;
            color: #333;
            font-weight: bold;
            text-align: center;
        }
        .modo-lectura .contrato-input { text-align: right; }
        .modo-lectura .input-group-text { display: none; }

        .leaflet-tooltip { background: rgba(255, 255, 255, 0.95); border: 1px solid #ccc; border-radius: 4px; box-shadow: 1px 1px 4px rgba(0,0,0,0.3); font-size: 11px; font-weight: bold; padding: 2px 6px; white-space: nowrap; pointer-events: none; }
        .custom-icon { display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-family: Arial, sans-serif; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .icon-circle { border-radius: 50%; width: 26px; height: 26px; font-size: 10px; }
        .icon-square { border-radius: 4px; width: 26px; height: 26px; font-size: 12px; }
        .icon-diamond { transform: rotate(45deg); width: 24px; height: 24px; font-size: 10px; }
        .icon-diamond span { transform: rotate(-45deg); display: block; }
        
        .bg-alta { background-color: #dc3545; }
        .bg-media { background-color: #ffc107; color: #000 !important; }
        .bg-baja { background-color: #28a745; }

        .popup-highlight-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; color: white; }
        .popup-highlight-avance { font-size: 20px; font-weight: 900; color: #007bff; display: block; margin-top: 5px; }
        
        .badge-alta { background-color: #dc3545; color: white; }
        .badge-media { background-color: #ffc107; color: black; }
        .badge-baja { background-color: #28a745; color: white; }

        @media print {
            body { background-color: white; }
            #map, .no-print, .card-header, .table-responsive { overflow: visible !important; max-height: none !important; }
            .no-print { display: none !important; }
            .table { min-width: 100% !important; font-size: 12px; }
            .contrato-input, .avance-input { border: none; font-weight: bold; text-align: right; }
        }
    </style>
</head>
<body class="modo-lectura">

<div class="container-fluid py-2">
    <div class="row text-center mb-2 no-print">
        <div class="col-12 d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Panel de Monitoreo FEN</h5>
            <div>
                <button class="btn btn-sm btn-outline-dark" onclick="toggleAdmin()" id="btnAdmin">🔒 Modo Edición</button>
                <button class="btn btn-sm btn-outline-primary" onclick="window.print()">📄 Reporte PDF</button>
            </div>
        </div>
        <p class="text-muted mb-0" style="font-size: 12px;">Sitios Arqueológicos - Región Lambayeque</p>
    </div>

    <div class="row mb-3 no-print">
        <div class="col-12">
            <div id="map"></div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-2">
                    <span style="font-size: 14px;">Control Presupuestal</span>
                    <small style="font-size: 12px;">Total Prog: S/ 1,964,571.12</small>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0" style="font-size: 0.85rem;">
                            <thead>
                                <tr>
                                    <th>Sitio</th>
                                    <th>Prioridad</th>
                                    <th>Prog. (S/)</th>
                                    <th>Contr. (S/)</th>
                                    <th>Avance (%)</th>
                                </tr>
                            </thead>
                            <tbody id="budgetTable">
                                <tr><td colspan="5" class="text-center py-3">Cargando datos de la nube...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://puente-fen.fiagotopo.workers.dev'; 
    const SUPABASE_KEY = 'sb_publishable_S-VFPOw7XhpURHUh01ideQ_tvNeDc42';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var map = L.map('map', { zoomControl: false }).setView([-6.65, -79.8], 10);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    var esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
    }).addTo(map);
    
    var esriStreets = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
    });
    L.control.layers({"Satelital": esriSatellite, "Callejero": esriStreets}).addTo(map);

    var tableBody = document.getElementById("budgetTable");
    var markersGroup = L.featureGroup().addTo(map);

    async function cargarDatos() {
        const { data: sitios, error } = await supabaseClient
            .from('sitios')
            .select('*')
            .order('id', { ascending: true });

        if (error) {
            console.error("Error cargando datos:", error);
            tableBody.innerHTML = `<tr><td colspan="5" class="text-danger text-center">Error al conectar con la base de datos.</td></tr>`;
            return;
        }

        tableBody.innerHTML = ''; 
        markersGroup.clearLayers(); 

        sitios.forEach(function(sitio) {
            let letraIcono = "CA", claseForma = "icon-circle";
            if (sitio.tipo === "Museo") { letraIcono = "M"; claseForma = "icon-square"; }
            else if (sitio.tipo === "Zona") { letraIcono = "ZA"; claseForma = "icon-diamond"; }

            let claseColor = "bg-media", colorPrioridadHex = "#ffc107";
            if (sitio.prioridad === "ALTA") { claseColor = "bg-alta"; colorPrioridadHex = "#dc3545"; }
            if (sitio.prioridad === "BAJA") { claseColor = "bg-baja"; colorPrioridadHex = "#28a745"; }

            let iconHtml = `<div class="custom-icon ${claseForma} ${claseColor}"><span>${letraIcono}</span></div>`;
            var customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [26, 26], iconAnchor: [13, 13] });

            // Mantenemos los valores actuales en variables
            let contratoVal = sitio.contrato || 0;
            let avanceVal = sitio.avance || 0;

            var marker = L.marker([sitio.lat, sitio.lng], { icon: customIcon }).addTo(markersGroup);
            
            marker.bindTooltip(sitio.nombre, { permanent: true, direction: 'right', className: 'custom-tooltip', offset: [15, 0] });

            // Función para generar el HTML del popup (para actualizarlo fácilmente)
            const generarPopupHTML = (avance, contrato) => `
                <div style="font-size: 13px; min-width: 180px;">
                    <b>${sitio.nombre}</b><br>
                    <span class="text-muted">Distrito: ${sitio.distrito}</span><br><hr style="margin: 6px 0;">
                    <b>Prioridad:</b> <span class="popup-highlight-badge" style="background-color: ${colorPrioridadHex}; color: ${sitio.prioridad === 'MEDIA' ? 'black' : 'white'};">${sitio.prioridad}</span><br>
                    <b>Ppto Prog:</b> S/ ${sitio.prog.toLocaleString('es-PE')}<br>
                    <b>Ppto Contr:</b> S/ ${Number(contrato).toLocaleString('es-PE')}<br>
                    <div style="margin-top: 8px; background: #e9ecef; padding: 6px; border-radius: 6px; text-align: center;">
                        <span style="font-size: 11px; text-transform: uppercase; color: #6c757d;">Avance Actual</span>
                        <span class="popup-highlight-avance" id="popup-avance-${sitio.id}">${avance}%</span>
                    </div>
                </div>
            `;

            marker.bindPopup(generarPopupHTML(avanceVal, contratoVal), { autoPanPaddingTopLeft: [20, 100] });

            var row = document.createElement("tr");
            row.className = "clickable-row";
            row.innerHTML = `
                <td><strong>${sitio.nombre}</strong><br><small class="text-muted">${sitio.distrito}</small></td>
                <td><span class="badge badge-${sitio.prioridad.toLowerCase()}">${sitio.prioridad}</span></td>
                <td>S/ ${sitio.prog.toLocaleString('es-PE', {minimumFractionDigits: 2})}</td>
                <td><input type="number" class="form-control form-control-sm contrato-input" id="contrato-${sitio.id}" value="${contratoVal}" placeholder="0.00"></td>
                <td>
                    <div class="input-group input-group-sm" style="width: 85px;">
                        <input type="number" class="form-control avance-input" id="avance-${sitio.id}" value="${avanceVal}" min="0" max="100">
                        <span class="input-group-text" style="padding: 0.25rem 0.4rem;">%</span>
                    </div>
                </td>
            `;
            tableBody.appendChild(row);

            row.addEventListener("click", function(e) {
                if(e.target.tagName.toLowerCase() === 'input') return;
                map.flyTo([sitio.lat + 0.015, sitio.lng], 13, { animate: true, duration: 1.2 });
                setTimeout(function() { marker.openPopup(); }, 1200);
            });

            let inputAvance = document.getElementById(`avance-${sitio.id}`);
            let inputContrato = document.getElementById(`contrato-${sitio.id}`);

            const guardarEnSupabase = async () => {
                if (document.body.classList.contains('modo-lectura')) return;
                
                let nuevoAvance = inputAvance.value === "" ? 0 : inputAvance.value;
                let nuevoContrato = inputContrato.value === "" ? 0 : inputContrato.value;

                const { error } = await supabaseClient
                    .from('sitios')
                    .update({ avance: nuevoAvance, contrato: nuevoContrato })
                    .eq('id', sitio.id);
                
                if (error) {
                    console.error("Error al guardar:", error);
                    alert("Error al guardar en la base de datos.");
                } else {
                    // ¡AQUÍ ESTÁ LA SOLUCIÓN AL ERROR ROJO!
                    // Solo actualizamos el DOM si el popup está visible. Si está cerrado, no pasa nada.
                    let popupAvance = document.getElementById(`popup-avance-${sitio.id}`);
                    if (popupAvance) {
                        popupAvance.innerText = nuevoAvance + "%";
                    }
                    
                    // Actualizamos el contenido del popup por si el usuario lo abre después
                    marker.setPopupContent(generarPopupHTML(nuevoAvance, nuevoContrato));
                }
            };

            inputAvance.addEventListener("blur", guardarEnSupabase);
            inputContrato.addEventListener("blur", guardarEnSupabase);
            
            inputAvance.addEventListener("keydown", function(e) {
                if (e.key === 'Enter') { this.blur(); }
            });
            inputContrato.addEventListener("keydown", function(e) {
                if (e.key === 'Enter') { this.blur(); }
            });
        });

        map.fitBounds(markersGroup.getBounds(), { padding: [30, 30] });
    }

    function toggleAdmin() {
        const esModoLectura = document.body.classList.contains('modo-lectura');
        const btn = document.getElementById('btnAdmin');

        if (esModoLectura) {
            let pass = prompt("Ingrese la contraseña de administrador:");
            if (pass === "admin123") { 
                document.body.classList.remove('modo-lectura');
                btn.innerHTML = "🔓 Modo Edición ON";
                btn.classList.replace('btn-outline-dark', 'btn-success');
            } else if (pass !== null) {
                alert("Contraseña incorrecta.");
            }
        } else {
            document.body.classList.add('modo-lectura');
            btn.innerHTML = "🔒 Modo Edición";
            btn.classList.replace('btn-success', 'btn-outline-dark');
        }
    }

    cargarDatos();
</script>
</body>
</html>
